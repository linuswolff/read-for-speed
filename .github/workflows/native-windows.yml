name: Build native Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Test native reader and library
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Lint native app
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Build portable executable
        shell: pwsh
        run: ./native/run.ps1 -Release -BuildOnly
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: SPEED-Native-Windows-x64
          path: native/target/x86_64-pc-windows-msvc/release/speed-native.exe
          if-no-files-found: error
