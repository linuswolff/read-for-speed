[package]
name = "speed-native"
version = "0.1.0"
edition = "2024"
description = "A focused, native RSVP reader built with Rust and GPUI"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "windows-manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"
dirs = "6"
rust-embed = { version = "8.13", features = ["debug-embed"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
strip = true
